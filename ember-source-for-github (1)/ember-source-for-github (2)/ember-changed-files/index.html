<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ember</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#16141f;--surface:#1e1c2a;--surface2:#252336;--border:#2e2b3f;--accent:#ff7c1f;--accent2:#c84bff;--text:#e2e0ee;--muted:#7a7890;--grad:linear-gradient(135deg,var(--accent),var(--accent2))}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font:13px/1.4 Inter,-apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
b{color:var(--accent);font-weight:inherit}
#app{display:flex;height:100%}
#side{width:224px;background:var(--surface);display:flex;flex-direction:column;padding:44px 10px 10px;-webkit-app-region:drag;border-right:1px solid var(--border)}
#side button,#side input{-webkit-app-region:no-drag}
.brand{display:flex;align-items:center;gap:9px;padding:0 6px 16px;font:600 20px Inter,-apple-system,system-ui,sans-serif;letter-spacing:-1px}
.brand small{display:block;font:500 11px Inter,system-ui,sans-serif;color:var(--muted);letter-spacing:0}
#tabs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:3px}
.tab{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border-left:3px solid transparent;text-align:left;width:100%;-webkit-app-region:no-drag}
.tab:hover{background:var(--surface2)}
.tab.on{background:var(--bg);border-left-color:var(--accent)}
.tab span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tab i{font-style:normal;color:var(--muted);padding:0 5px;border-radius:6px}
.tab i:hover{background:var(--surface2);color:var(--text)}
#add,#addp{padding:9px 10px;border-radius:10px;color:var(--muted);text-align:left}
#add:hover,#addp:hover{background:var(--surface2);color:var(--text)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;gap:6px;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--border);-webkit-app-region:drag}
#top button,#top input{-webkit-app-region:no-drag}
#top button{width:32px;border-radius:999px;color:var(--muted)}
#top button:hover{background:var(--surface2);color:var(--text)}
#top button.mail{width:auto;padding:0 16px;color:var(--text);border:1px solid var(--border);font-weight:600}
#top button.mail.on{background:var(--accent);border-color:var(--accent);color:#fff}
#bar{flex:1;padding:8px 16px;border-radius:999px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit}
#bar:focus{border-color:var(--accent);outline:0}
#stage{flex:1;display:flex;min-height:0}
#views{flex:1;position:relative;background:var(--bg)}
webview{position:absolute;inset:0;width:100%;height:100%}
#mail{width:420px;border-left:1px solid var(--border);position:relative;background:var(--bg);display:none}
#start{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.brand small.by{display:flex;align-items:center;gap:5px}
.eyebrow{display:flex;align-items:center;gap:8px;font-weight:600;font-size:11px;letter-spacing:2px;color:var(--accent)}
#start h1{font:700 84px/1.05 Inter,-apple-system,"SF Pro Display",system-ui,sans-serif;letter-spacing:-3px}
#start p{color:var(--muted);font-size:16px}
#start form{width:min(520px,80%);margin:22px 0 10px}
#q{width:100%;padding:14px 22px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:15px}
#q:focus{border-color:var(--accent);outline:0}
.links{display:flex;gap:10px}
.links button{padding:14px 32px;border-radius:100px;font-size:15px;background:var(--surface2);border:1px solid var(--border);font-weight:600}
.links button:hover{background:var(--border)}
.links button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.links button.primary:hover{opacity:.9;background:var(--accent)}
.motto{margin-top:30px;font:800 22px Inter,system-ui,sans-serif;letter-spacing:-.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.star{display:inline-block;vertical-align:middle;flex:none}
#start{isolation:isolate}
#wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:.05;z-index:-1}
#wm svg{width:min(70vh,60%);height:auto}
.tab em{display:flex;font-style:normal}
#signin{margin:0 0 10px;padding:10px 14px;border-radius:100px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;gap:8px;font-weight:600;-webkit-app-region:no-drag}
#signin:hover{background:var(--border)}
.foot{padding:12px 6px 2px;border-top:1px solid var(--border);color:var(--muted);font-size:11px;display:flex;align-items:center;gap:7px}
.foot b{color:var(--text);font-weight:600}
#lstar{display:none;align-items:center;padding:0 4px}
#mail.open{display:flex;flex-direction:column}
#mailhead{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border);font-weight:600;font-size:15px;letter-spacing:-.3px}
#mailhead b{color:var(--accent)}
.band{position:absolute;bottom:0;left:0;right:0;text-align:center;padding:14px;background:var(--surface);border-top:1px solid var(--border);color:var(--muted);font-size:12px}
.band strong{color:var(--accent);font-weight:600}
#results{position:absolute;inset:0;overflow:auto;background:var(--bg);display:none;padding:32px 24px}
.rin{max-width:680px;margin:0 auto}.rh{color:var(--muted);margin-bottom:22px;font-weight:600}.rh b{color:var(--accent)}
.res{position:relative;margin-bottom:18px;padding:18px 20px;border:1px solid var(--border);background:linear-gradient(145deg,var(--surface),rgba(37,35,54,.72));border-radius:16px;transition:transform .15s,border-color .15s,background .15s;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.res:hover{transform:translateY(-1px);border-color:#45405c;background:var(--surface2)}
.res a{color:#ff9b52;font-size:18px;font-weight:650;display:block;cursor:pointer;letter-spacing:-.2px}.res a:hover{text-decoration:underline;color:#ffb273}
.res small{color:#8f8ba5;display:block;margin:5px 0 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}.res p{color:#b9b5c8;line-height:1.55;max-width:650px}
.result-logo{width:28px;height:28px;object-fit:contain;border-radius:8px;float:right;margin-left:12px}.result-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}.result-num{color:#68647b;font-size:11px;font-weight:700;min-width:18px}.trust{display:inline-flex;align-items:center;gap:5px;margin-top:9px;padding:4px 8px;border-radius:999px;background:rgba(255,124,31,.1);border:1px solid rgba(255,124,31,.22);color:#ffad6a;font-size:10px;font-weight:700}.trust svg{width:12px;height:12px}
#results{padding:30px 28px}.search-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}.search-head img{width:32px;height:32px}.search-head h2{font-size:21px;letter-spacing:-.5px}.search-sub{color:var(--muted);font-size:12px;margin-bottom:22px}.search-sub b{color:var(--text);font-weight:600}

/* Ember Search — familiar layout, Ember personality */
#results{background:var(--bg);color:var(--text);padding:0;overflow:auto;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.search-page{max-width:940px;margin:0 auto;padding:30px 38px 70px}
.search-brand{display:flex;align-items:center;gap:11px;margin-bottom:20px}.search-brand img{width:38px;height:38px}.search-brand .word{font-size:25px;font-weight:700;letter-spacing:-1.1px;color:var(--text)}.search-brand .word b,.search-brand .word span{color:var(--accent)}
.searchbox{height:50px;border:1px solid var(--border);border-radius:26px;display:flex;align-items:center;padding:0 12px 0 18px;background:var(--surface);box-shadow:0 8px 24px rgba(0,0,0,.16);margin-bottom:18px;transition:.15s}.searchbox:focus-within{box-shadow:0 10px 30px rgba(0,0,0,.24);border-color:#555064}.searchbox input{flex:1;border:0;outline:0;font:15px Inter;color:var(--text);background:transparent}.searchbox button{font-size:19px;color:var(--muted);padding:8px 11px;border-radius:50%}.searchbox button:hover{background:var(--surface2);color:var(--text)}
.search-tabs{height:40px;border-bottom:1px solid var(--border);display:flex;gap:24px;align-items:flex-end;margin-bottom:22px}.search-tabs span{padding:0 3px 11px;color:var(--muted);font-size:13px}.search-tabs .active{color:#ff9b52;border-bottom:3px solid var(--accent)}
.search-meta{font-size:12px;color:var(--muted);margin-bottom:22px}.search-meta b{color:var(--text);font-weight:600}
.result{padding:0 0 23px;margin:0 0 22px;border:0;border-bottom:1px solid rgba(255,255,255,.07);background:transparent;box-shadow:none}.result:hover{transform:none;background:transparent;border-bottom-color:rgba(255,124,31,.25)}.result .result-url{display:flex;align-items:center;gap:8px;color:#9d99ad;font-size:12px;margin-bottom:5px}.result .favicon{width:19px;height:19px;border-radius:6px;object-fit:contain;background:var(--surface2)}.result a{font-size:19px;line-height:1.3;color:#ff9b52;font-weight:650;letter-spacing:-.15px;text-decoration:none}.result a:hover{text-decoration:underline;color:#ffb273}.result p{font-size:13px;line-height:1.6;color:#bbb7c7;max-width:740px;margin-top:6px}.result .trust{margin-top:9px;background:linear-gradient(135deg,rgba(224,70,207,.13),rgba(255,124,31,.13));border:1px solid rgba(255,124,31,.3);color:#ffb347;font-size:11px;width:max-content}.result .trust::before{content:'✦';color:#e046cf;margin-right:1px}
.search-loading,.search-empty{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);gap:10px}.search-empty h3{font-size:21px;color:var(--text);letter-spacing:-.4px}.search-empty p{max-width:430px;line-height:1.6}.search-empty .ember-face{font-size:34px;margin-bottom:2px}.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-right-color:#e046cf;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.web-error{position:absolute;inset:0;z-index:5;background:rgba(22,20,31,.98);display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;animation:errorIn .22s ease-out}.web-error-card{max-width:560px;padding:42px 44px;border:1px solid #3a354c;background:linear-gradient(145deg,#211e2e,#181622);border-radius:28px;box-shadow:0 28px 90px rgba(0,0,0,.5)}.web-error-card img{width:76px;height:76px;margin-bottom:18px;filter:drop-shadow(0 8px 20px rgba(255,124,31,.18))}.web-error-card h2{font-size:28px;letter-spacing:-.8px;margin-bottom:9px}.web-error-card p{color:#aaa6b8;line-height:1.6;margin-bottom:18px}.web-error-card code{display:block;background:#171520;border:1px solid #302c40;padding:10px 12px;border-radius:10px;color:#898497;font-size:11px;margin-bottom:20px}.web-error-card button{padding:11px 22px;border-radius:999px;background:linear-gradient(135deg,var(--accent),#e046cf);color:#fff;font-weight:750;box-shadow:0 8px 22px rgba(224,70,207,.18)}.web-error-card button:hover{filter:brightness(1.08)}@keyframes errorIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}
#ltrust{display:none;align-items:center;gap:7px;margin:0 6px;padding:5px 10px;border-radius:999px;background:linear-gradient(135deg,rgba(232,75,216,.13),rgba(255,122,47,.11));border:1px solid rgba(255,122,47,.28);color:#ffb08b;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 3px 14px rgba(232,75,216,.08)}.trust-shield{width:15px;height:17px;display:inline-block}

.coal-icon{width:74px;height:74px;display:block;filter:drop-shadow(0 10px 22px rgba(0,0,0,.35))}.ember-face .coal-icon{width:68px;height:68px;margin:0 auto 12px}.ember-face{display:flex;align-items:center;justify-content:center;min-height:74px}
.error-brand{display:inline-flex;align-items:center;gap:7px;margin-bottom:16px;color:#ffb08b;font-weight:750;font-size:12px;letter-spacing:.2px}.error-brand img{width:18px;height:18px}.shield{width:19px;height:22px}.ember-error-brand{color:#ff9b52}.error-icon{width:74px;height:74px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;border-radius:24px;background:radial-gradient(circle at 30% 25%,rgba(255,124,31,.22),rgba(224,70,207,.08));border:1px solid #3a354c;color:#ff9b52;font-size:32px}.error-icon .shield{width:38px;height:43px}.error-home{margin-left:8px;padding:11px 18px;border-radius:999px;background:#242130;color:#c8c3d5;border:1px solid #3a354c;font-weight:700}.error-home:hover{background:#2b2739}.result{position:relative}.result.featured{padding:20px 22px;border:1px solid rgba(255,124,31,.2);border-radius:20px;background:linear-gradient(135deg,rgba(255,124,31,.07),rgba(224,70,207,.035));box-shadow:0 12px 35px rgba(0,0,0,.16)}.result.featured a{font-size:20px}.result.compact{padding:13px 15px;border-radius:15px;background:rgba(255,255,255,.018)}.result.compact p{display:none}.result.lareon-result{border-color:rgba(232,75,216,.3);background:linear-gradient(135deg,rgba(232,75,216,.09),rgba(255,122,47,.045))}.trust{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:4px 9px;border-radius:999px;background:rgba(232,75,216,.11);border:1px solid rgba(255,122,47,.25);color:#ffb08b;font-size:10px;font-weight:750}.trust .shield{width:13px;height:15px}.result-number{position:absolute;right:16px;top:14px;font-size:10px;color:#706a80;font-weight:700}.search-list{display:flex;flex-direction:column;gap:10px}

/* Ember 23 result chassis */
.res{
  margin:0 0 12px;
  padding:16px 18px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;
  background:linear-gradient(135deg,rgba(35,31,47,.96),rgba(25,22,34,.96));
  box-shadow:0 5px 18px rgba(0,0,0,.18);
  transition:transform .15s ease,border-color .15s ease,background .15s ease;
}
.res:hover{
  transform:translateY(-1px);
  border-color:rgba(211,125,255,.22);
  background:linear-gradient(135deg,rgba(42,36,55,.98),rgba(27,23,38,.98));
}
.result-top{display:flex;align-items:flex-start;gap:11px;margin-bottom:5px}
.result-num{flex:0 0 auto;min-width:25px;color:#9c91a8;font-size:11px;font-weight:700;letter-spacing:.08em;padding-top:4px}
.result-top a{color:#f4edf8;font-size:16px;line-height:1.3;font-weight:650;text-decoration:none;cursor:pointer}
.result-top a:hover{color:#d99cff}
.res small{display:block;margin:0 0 8px 36px;color:#a99bb4;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res p{margin:0 0 0 36px;color:#c8becf;font-size:13px;line-height:1.55}
.trust{display:inline-flex;align-items:center;gap:7px;margin:11px 0 0 36px;padding:5px 9px;border-radius:8px;background:rgba(137,71,145,.14);border:1px solid rgba(213,137,220,.15);color:#dcb6df;font-size:11px}
#results{overflow-y:auto;overflow-x:hidden}


/* ---- Ember: coal icon, Lareon trusted badges, paging footer ---- */
@keyframes clSmoke{0%{transform:translateY(4px);opacity:0}25%{opacity:.55}100%{transform:translateY(-9px);opacity:0}}
@keyframes clGlow{0%,100%{opacity:.25}50%{opacity:.6}}
@keyframes ltShine{0%{transform:translateX(-140%) skewX(-18deg)}60%,100%{transform:translateX(260%) skewX(-18deg)}}
.coal-icon .cl-smoke{animation:clSmoke 4.5s ease-in-out infinite}.coal-icon .cl-smoke.s2{animation-delay:1.8s}
.coal-icon .cl-glow,.coal-icon .cl-crack{animation:clGlow 3.6s ease-in-out infinite}.coal-icon .cl-crack.c2{animation-delay:1.2s;opacity:.3}
.coal-icon{width:96px;height:96px;filter:drop-shadow(0 12px 24px rgba(0,0,0,.45))}
.error-icon{width:116px;height:116px;border-radius:34px;background:radial-gradient(circle at 50% 32%,rgba(255,124,31,.1),rgba(17,16,24,.6) 70%);border:1px solid #302c40}
.error-icon .coal-icon{width:98px;height:98px}
.ember-face .coal-icon{width:84px;height:84px}
#ltrust{position:relative;overflow:hidden;gap:8px;padding:5px 13px 5px 9px;border:1px solid transparent;background:linear-gradient(#1d1a28,#1d1a28) padding-box,linear-gradient(120deg,#ff7a2f,#e84bd8 55%,#ff7a2f) border-box;color:#f1e6ef;box-shadow:0 4px 18px rgba(232,75,216,.14),inset 0 0 12px rgba(255,122,47,.06)}
#ltrust::after{content:'';position:absolute;top:0;bottom:0;left:0;width:34%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);animation:ltShine 5s ease-in-out infinite;pointer-events:none}
#ltrust .trust-shield{width:15px;height:17px;filter:drop-shadow(0 0 6px rgba(255,122,47,.55))}
#ltrust .lt-text{font-size:11px;font-weight:600;letter-spacing:.35px;color:#cdbfd0}
#ltrust .lt-text b{font-weight:800;background:linear-gradient(120deg,#ffb347,#ff7a2f 45%,#ff6bd6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.2px}
.result .trust{position:relative;overflow:hidden;gap:7px;margin:12px 0 0;padding:5px 12px 5px 8px;border:1px solid transparent;border-radius:999px;background:linear-gradient(#1d1a28,#1d1a28) padding-box,linear-gradient(120deg,#ff7a2f,#e84bd8 55%,#ff7a2f) border-box;color:#cdbfd0;font-size:11px;font-weight:600;letter-spacing:.3px;width:max-content;box-shadow:0 4px 16px rgba(232,75,216,.12)}
.result .trust::before{content:none}
.result .trust::after{content:'';position:absolute;top:0;bottom:0;left:0;width:34%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.2),transparent);animation:ltShine 6s ease-in-out infinite;pointer-events:none}
.result .trust .shield{width:13px;height:15px;filter:drop-shadow(0 0 5px rgba(255,122,47,.5))}
.result .trust b{font-weight:800;background:linear-gradient(120deg,#ffb347,#ff7a2f 45%,#ff6bd6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.result.lareon-result{box-shadow:0 0 0 1px rgba(232,75,216,.18),0 10px 34px rgba(232,75,216,.08)}
.result.lareon-result::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:linear-gradient(#ff7a2f,#e84bd8)}
.search-foot{display:flex;align-items:center;justify-content:center;gap:12px;padding:26px 0 54px;color:var(--muted);font-size:12px}
.search-foot .spinner{width:20px;height:20px;border-width:2px}
.more-btn{padding:11px 26px;border-radius:999px;background:#242130;color:#e7e2f2;border:1px solid #3a354c;font-weight:700}.more-btn:hover{background:#2b2739}
.error-home+.error-home{margin-left:8px}

.search-foot{flex-direction:column;gap:6px}
.pager{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pg{min-width:40px;padding:9px 13px;border-radius:12px;background:#242130;color:#c8c3d5;border:1px solid #3a354c;font-weight:700;font-size:12px}
.pg:hover{background:#2b2739}.pg.on{background:linear-gradient(135deg,var(--accent),#e046cf);color:#fff;border-color:transparent}
.pager-note{color:var(--muted);font-size:12px;margin-bottom:10px}
/* ---- Error screens: one banked-ember look ---- */
.web-error{background:var(--bg);overflow:hidden}
.err{max-width:460px;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 24px;animation:errIn .4s cubic-bezier(.2,.8,.2,1)}
.err .error-brand{margin-bottom:26px}
.err-art{margin-bottom:22px;display:grid;place-items:center}
.err-svg{width:92px;height:92px;filter:drop-shadow(0 0 22px rgba(255,124,31,.22))}
.err-art .shield{width:54px;height:62px}
.err-glow{animation:errBreath 3.4s ease-in-out infinite}
.err h2{font-size:26px;letter-spacing:-.7px;margin-bottom:10px}
.err p{color:#aaa6b8;line-height:1.6;margin-bottom:16px}
.err-url{padding:4px 12px;border-radius:999px;background:#1b1927;border:1px solid var(--border);color:#a9a4b8;font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;margin-bottom:24px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.err-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.err-actions .error-home{margin:0}
.err-primary{padding:11px 24px;border-radius:999px;background:linear-gradient(135deg,var(--accent),#e046cf);color:#fff;font-weight:750;box-shadow:0 8px 22px rgba(224,70,207,.2)}
.err-primary:hover{filter:brightness(1.1)}
.err code{display:block;color:#6f6a80;font-size:11px}
@keyframes errIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes errBreath{0%,100%{opacity:.35}50%{opacity:.95}}

/* ---- Motion: smooth transitions across the app ---- */
button{transition:background-color .18s,color .18s,filter .18s,box-shadow .18s,transform .15s,border-color .18s}
button:active{transform:scale(.97)}
.tab{transition:background-color .18s,border-color .18s,transform .15s}
.tab:hover{transform:translateX(2px)}
.tab.enter{animation:tabIn .26s cubic-bezier(.2,.8,.2,1)}
.tab i{transition:background-color .15s,color .15s}
#bar{transition:border-color .2s,box-shadow .2s}
