name: Build installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach installers to
        default: v0.9.0
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
          - os: macos-latest
            flag: --mac
          - os: ubuntu-latest
            flag: --linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Find the app folder
        shell: bash
        run: |
          dir=""
          while IFS= read -r f; do
            d=$(dirname "$f")
            if [ -f "$d/setup-preload.js" ] && [ -f "$d/main.js" ] && [ -f "$d/welcome.html" ]; then dir="$d"; break; fi
          done < <(find . -maxdepth 4 -name package.json -not -path '*/node_modules/*')
          if [ -z "$dir" ]; then
            echo "No folder contains package.json, main.js, welcome.html and setup-preload.js together. Files found:"
            find . -maxdepth 4 -not -path './.git/*' | head -60
            exit 1
          fi
          echo "Building from: $dir"
          if [ "$dir" = "." ]; then
            mkdir app
            for x in * .[!.]*; do
              case "$x" in app|.git|.github|'*') continue;; esac
              [ -e "$x" ] && mv "$x" app/
            done
          else
            mv "$dir" app
          fi
          if [ -d app/ember-changed-files ]; then cp app/ember-changed-files/* app/; echo "Applied files from ember-changed-files"; fi
          ls app
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: app
      - run: npx electron-builder ${{ matrix.flag }} --publish never
        working-directory: app
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.AppImage
